
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon compte | Vesubia Card Store</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>
/* VESUBIA — ESPACE CLIENT */

.account-page {
    min-height: 80vh !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    padding: 65px 20px !important;
    background: #09090b !important;
    color: #f5f2e9 !important;
}

.account-box {
    width: 100% !important;
    max-width: 480px !important;
    padding: 40px !important;
    background: #141417 !important;
    border: 1px solid rgba(255,217,40,.35) !important;
    border-radius: 18px !important;
    box-shadow: 0 15px 50px rgba(0,0,0,.4) !important;
}

.account-heading {
    text-align: center !important;
    margin-bottom: 30px !important;
}

.account-heading h1 {
    font-family: 'Playfair Display',serif !important;
    font-size: 34px !important;
    line-height: 1.2 !important;
    color: #f5f2e9 !important;
    margin-bottom: 12px !important;
}

.account-heading h1 span {
    color: #ffd928 !important;
}

.account-heading p {
    color: #aaa !important;
    font-size: 14px !important;
}

.account-tabs {
    display: flex !important;
    gap: 10px !important;
    margin-bottom: 25px !important;
}

.account-tabs button {
    flex: 1 !important;
    padding: 13px !important;
    border: 1px solid #444 !important;
    border-radius: 8px !important;
    background: #202024 !important;
    color: #ddd !important;
    cursor: pointer !important;
    font-size: 14px !important;
}

.account-tabs button.active {
    background: #ffd928 !important;
    color: #111 !important;
    border-color: #ffd928 !important;
    font-weight: bold !important;
}

.account-form {
    display: flex !important;
    flex-direction: column !important;
    gap: 18px !important;
}

.account-form[hidden] {
    display: none !important;
}

.account-form label {
    display: block !important;
    color: #ddd !important;
    font-size: 13px !important;
    margin-bottom: 8px !important;
}

.account-form input {
    display: block !important;
    width: 100% !important;
    padding: 14px !important;
    background: #09090b !important;
    border: 1px solid #38383d !important;
    border-radius: 8px !important;
    color: white !important;
    font-size: 14px !important;
    box-sizing: border-box !important;
}

.account-form input:focus {
    border-color: #ffd928 !important;
    outline: none !important;
}

.account-submit {
    width: 100% !important;
    padding: 15px !important;
    margin-top: 8px !important;
    border: none !important;
    border-radius: 8px !important;
    background: #ffd928 !important;
    color: #111 !important;
    font-weight: bold !important;
    cursor: pointer !important;
}

.account-message {
    color: #ffd928 !important;
    text-align: center !important;
    font-size: 13px !important;
    line-height: 1.6 !important;
    margin-top: 18px !important;
}

.account-back {
    display: block !important;
    text-align: center !important;
    margin-top: 25px !important;
    color: #aaa !important;
    text-decoration: none !important;
}

.account-back:hover {
    color: #ffd928 !important;
}

@media (max-width: 600px) {
    .account-page {
        padding: 35px 15px !important;
    }

    .account-box {
        padding: 25px 20px !important;
    }

    .account-heading h1 {
        font-size: 28px !important;
    }
}
</style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin/supabase.js"></script>

    
</head>

<body>

<header class="site-header">

    <a href="index.html" class="brand">
        <img src="images/logo/logovs.png" alt="Logo Vesubia Card Store">

        <span class="brand-name">
            <strong>VESUBIA</strong>
            <small>CARD STORE</small>
        </span>
    </a>

    <button class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Ouvrir le menu"
            aria-expanded="false"
            aria-controls="main-nav">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="main-nav" id="main-nav">

        <a href="index.html">Accueil</a>
        <a href="boutique.html">Boutique</a>
        <a href="cartes-rares.html">Cartes rares</a>
        <a href="histoire.html">Notre histoire</a>
        <a href="contact.html">Contact</a>

        <a href="connexion.html" class="header-account-btn">
            <i class="fa-regular fa-user"></i>
            Connexion
        </a>

        <a href="avis.html" class="header-avis-btn">
            <span>★</span> Avis
        </a>

        <a href="favoris.html" aria-label="Favoris">
            <i class="fa-regular fa-heart"></i>
        </a>

    </nav>

</header>

<main class="account-page">
    <div class="account-box">

        <div class="account-heading">
            <h1>Bienvenue chez <span>Vesubia</span></h1>
            <p>Connectez-vous à votre espace collectionneur.</p>
        </div>

        <div class="account-tabs">
            <button type="button" id="login-tab" class="active">
                Connexion
            </button>
            <button type="button" id="register-tab">
                Inscription
            </button>
        </div>

        <form id="login-form" class="account-form">
            <div>
                <label for="login-email">Adresse e-mail</label>
                <input id="login-email" type="email" required autocomplete="email">
            </div>

            <div>
                <label for="login-password">Mot de passe</label>
                <input id="login-password" type="password" required autocomplete="current-password">
            </div>

            <button class="account-submit" type="submit">
                Se connecter
            </button>
        </form>

        <form id="register-form" class="account-form" hidden>
            <div>
                <label for="first-name">Prénom</label>
                <input id="first-name" type="text" required autocomplete="given-name">
            </div>

            <div>
                <label for="last-name">Nom</label>
                <input id="last-name" type="text" required autocomplete="family-name">
            </div>

            <div>
                <label for="register-email">Adresse e-mail</label>
                <input id="register-email" type="email" required autocomplete="email">
            </div>

            <div>
                <label for="register-password">Mot de passe (8 caractères minimum)</label>
                <input id="register-password" type="password" minlength="8" required autocomplete="new-password">
            </div>

            <div>
                <label for="confirm-password">Confirmer le mot de passe</label>
                <input id="confirm-password" type="password" minlength="8" required autocomplete="new-password">
            </div>

            <button class="account-submit" type="submit">
                Créer mon compte
            </button>
        </form>

        <p id="account-message" class="account-message" role="status" aria-live="polite"></p>

        <a href="index.html" class="account-back">
            <i class="fa-solid fa-arrow-left"></i> Retour à la boutique
        </a>

    </div>
</main>

<footer class="site-footer">
    <p>© 2026 <strong>VESUBIA CARD STORE</strong> — Tous droits réservés.</p>
</footer>


<script>
document.addEventListener("DOMContentLoaded", () => {

    const loginTab = document.getElementById("login-tab");
    const registerTab = document.getElementById("register-tab");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const message = document.getElementById("account-message");

    // Déterminer la page de retour
    const params = new URLSearchParams(window.location.search);
    const returnToAvis = params.get("retour") === "avis";

    const destination = returnToAvis
        ? "avis.html"
        : "mon-compte.html";

    function showForm(type) {
        const isLogin = type === "login";

        loginForm.hidden = !isLogin;
        registerForm.hidden = isLogin;

        loginTab.classList.toggle("active", isLogin);
        registerTab.classList.toggle("active", !isLogin);

        message.textContent = "";
    }

    loginTab.addEventListener("click", () => showForm("login"));
    registerTab.addEventListener("click", () => showForm("register"));

    // CONNEXION
    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        message.textContent = "Connexion en cours...";

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            message.textContent = "Erreur : " + error.message;
            return;
        }

        window.location.replace(destination);
    });

    // INSCRIPTION
    registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const firstName = document.getElementById("first-name").value.trim();
        const lastName = document.getElementById("last-name").value.trim();
        const email = document.getElementById("register-email").value.trim();
        const password = document.getElementById("register-password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        if (password !== confirmPassword) {
            message.textContent = "Les deux mots de passe ne correspondent pas.";
            return;
        }

        message.textContent = "Création de votre compte...";

        const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
                data: {
                    first_name: firstName,
                    last_name: lastName
                },
                emailRedirectTo: new URL(
                    destination,
                    window.location.href
                ).href
            }
        });

        if (error) {
            message.textContent = "Erreur : " + error.message;
            return;
        }

        if (data.session) {
            window.location.replace(destination);
            return;
        }

        message.textContent =
            "Votre compte a été créé ! Vérifiez votre boîte mail pour confirmer votre adresse. Vous serez redirigé vers votre avis après confirmation.";
    });

    // Si la personne est déjà connectée
    (async () => {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
            console.error("Vérification de session :", error);
            return;
        }

        if (data.session) {
            window.location.replace(destination);
        }
    })();

});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const button = document.getElementById("menu-toggle");
    const menu = document.getElementById("main-nav");

    if (!button || !menu) return;

    button.addEventListener("click", () => {
        const opened = menu.classList.toggle("is-open");

        button.classList.toggle("active", opened);
        button.setAttribute("aria-expanded", opened);
        button.setAttribute(
            "aria-label",
            opened ? "Fermer le menu" : "Ouvrir le menu"
        );
    });

    menu.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", () => {
            menu.classList.remove("is-open");
            button.classList.remove("active");
            button.setAttribute("aria-expanded", "false");
        });
    });
});
</script>
</body>
</html>
