
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon compte | Vesubia Card Store</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin/supabase.js"></script>

    
</head>

<body>

<header class="site-header">
    <a href="index.html" class="brand">
        <img src="images/logo/logovs.png" alt="Logo Vesubia Card Store">
        <span class="brand-name">
            <strong>VESUBIA</strong>
            <small>CARD STORE</small>
        </span>
    </a>

    <nav class="main-nav">
    <a href="index.html">Accueil</a>
    <a href="boutique.html">Boutique</a>
    <a href="cartes-rares.html">Cartes rares</a>
    <a href="contact.html">Contact</a>
</nav>

<a href="connexion.html" class="header-account-btn">
    <i class="fa-regular fa-user"></i>
    Connexion
</a>
<a href="avis.html" class="header-avis-btn">
    <span>★</span> Avis
</a>
</header>

<main class="account-page">
    <div class="account-box">

        <div class="account-heading">
            <h1>Bienvenue chez <span>Vesubia</span></h1>
            <p>Connectez-vous à votre espace collectionneur.</p>
        </div>

        <div class="account-tabs">
            <button type="button" id="login-tab" class="active">
                Connexion
            </button>
            <button type="button" id="register-tab">
                Inscription
            </button>
        </div>

        <form id="login-form" class="account-form">
            <div>
                <label for="login-email">Adresse e-mail</label>
                <input id="login-email" type="email" required autocomplete="email">
            </div>

            <div>
                <label for="login-password">Mot de passe</label>
                <input id="login-password" type="password" required autocomplete="current-password">
            </div>

            <button class="account-submit" type="submit">
                Se connecter
            </button>
        </form>

        <form id="register-form" class="account-form" hidden>
            <div>
                <label for="first-name">Prénom</label>
                <input id="first-name" type="text" required autocomplete="given-name">
            </div>

            <div>
                <label for="last-name">Nom</label>
                <input id="last-name" type="text" required autocomplete="family-name">
            </div>

            <div>
                <label for="register-email">Adresse e-mail</label>
                <input id="register-email" type="email" required autocomplete="email">
            </div>

            <div>
                <label for="register-password">Mot de passe (8 caractères minimum)</label>
                <input id="register-password" type="password" minlength="8" required autocomplete="new-password">
            </div>

            <div>
                <label for="confirm-password">Confirmer le mot de passe</label>
                <input id="confirm-password" type="password" minlength="8" required autocomplete="new-password">
            </div>

            <button class="account-submit" type="submit">
                Créer mon compte
            </button>
        </form>

        <p id="account-message" class="account-message" role="status" aria-live="polite"></p>

        <a href="index.html" class="account-back">
            <i class="fa-solid fa-arrow-left"></i> Retour à la boutique
        </a>

    </div>
</main>

<footer class="site-footer">
    <p>© 2026 <strong>VESUBIA CARD STORE</strong> — Tous droits réservés.</p>
</footer>


<script>
document.addEventListener("DOMContentLoaded", () => {

    const loginTab = document.getElementById("login-tab");
    const registerTab = document.getElementById("register-tab");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const message = document.getElementById("account-message");

    // Déterminer la page de retour
    const params = new URLSearchParams(window.location.search);
    const returnToAvis = params.get("retour") === "avis";

    const destination = returnToAvis
        ? "avis.html"
        : "mon-compte.html";

    function showForm(type) {
        const isLogin = type === "login";

        loginForm.hidden = !isLogin;
        registerForm.hidden = isLogin;

        loginTab.classList.toggle("active", isLogin);
        registerTab.classList.toggle("active", !isLogin);

        message.textContent = "";
    }

    loginTab.addEventListener("click", () => showForm("login"));
    registerTab.addEventListener("click", () => showForm("register"));

    // CONNEXION
    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        message.textContent = "Connexion en cours...";

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            message.textContent = "Erreur : " + error.message;
            return;
        }

        window.location.replace(destination);
    });

    // INSCRIPTION
    registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const firstName = document.getElementById("first-name").value.trim();
        const lastName = document.getElementById("last-name").value.trim();
        const email = document.getElementById("register-email").value.trim();
        const password = document.getElementById("register-password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        if (password !== confirmPassword) {
            message.textContent = "Les deux mots de passe ne correspondent pas.";
            return;
        }

        message.textContent = "Création de votre compte...";

        const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
                data: {
                    first_name: firstName,
                    last_name: lastName
                },
                emailRedirectTo: new URL(
                    destination,
                    window.location.href
                ).href
            }
        });

        if (error) {
            message.textContent = "Erreur : " + error.message;
            return;
        }

        if (data.session) {
            window.location.replace(destination);
            return;
        }

        message.textContent =
            "Votre compte a été créé ! Vérifiez votre boîte mail pour confirmer votre adresse. Vous serez redirigé vers votre avis après confirmation.";
    });

    // Si la personne est déjà connectée
    (async () => {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
            console.error("Vérification de session :", error);
            return;
        }

        if (data.session) {
            window.location.replace(destination);
        }
    })();

});
</script>


</body>
</html>
