
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des produits | Vesubia Card Store</title>
<link rel="icon" type="image/png" href="logorouge.png">
    <link rel="stylesheet" href="admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="products.js" defer></script>
</head>

<body class="admin-page">

    <header class="admin-header">
        <a href="dashboard.html" class="admin-brand">
            <img src="../images/logo/logovs.png" alt="Logo Vesubia">
            <span>
                <strong>VESUBIA</strong>
                <small>CARD STORE · ADMINISTRATION</small>
            </span>
        </a>

        <div>
            <a href="admin.html" class="admin-back">Ajouter un produit</a>
            <button type="button" id="logout-button">Déconnexion</button>
        </div>
    </header>

    <main class="admin-container products-manager">

        <div class="admin-welcome">
            <span class="admin-eyebrow">GESTION DU CATALOGUE</span>
            <h1>Mes produits</h1>
            <p>Retrouvez ici tous les produits de votre boutique.</p>
        </div>

        <div class="products-manager-top">
            <p id="products-count">Chargement des produits...</p>
            <a href="admin.html" class="publish-button">
                + Ajouter un produit
            </a>
        </div>

        <div id="products-list" class="admin-products-grid">
            <p>Chargement...</p>
        </div>

        <p id="products-message" role="status"></p>

    </main>

    <!-- FENÊTRE DE MODIFICATION -->
    <div id="edit-modal" class="edit-modal" hidden>
        <div class="edit-modal-content">
            <button type="button" id="close-modal" class="close-modal"
                    aria-label="Fermer">×</button>

            <span class="admin-eyebrow">MODIFICATION</span>
            <h2>Modifier le produit</h2>

            <form id="edit-form">
                <label for="edit-name">Nom du produit</label>
                <input type="text" id="edit-name" required>

                <label for="edit-description">Description</label>
                <textarea id="edit-description" rows="4" required></textarea>

                <div class="form-row">
                    <div>
                        <label for="edit-price">Prix (€)</label>
                        <input type="number" id="edit-price"
                               min="0" step="0.01" required>
                    </div>

                    <div>
                        <label for="edit-stock">Stock</label>
                        <input type="number" id="edit-stock"
                               min="0" step="1" required>
                    </div>
                </div>

                <label for="edit-category">Catégorie</label>
                <select id="edit-category" required>
                    <option value="boosters">Boosters</option>
                    <option value="coffrets">Coffrets</option>
                    <option value="displays">Displays</option>
                    <option value="cartes">Cartes à l'unité</option>
                    <option value="accessoires">Accessoires</option>
                </select>

                <label for="edit-image">Nouvelle photo (facultatif)</label>
                <input type="file" id="edit-image"
                       accept="image/jpeg,image/png,image/webp">

                <label class="featured-option">
                    <input type="checkbox" id="edit-featured">
                    <span>
                        <strong>Afficher à la une</strong>
                    </span>
                </label>

                <button type="submit" id="save-edit-button"
                        class="publish-button">
                    Enregistrer les modifications
                </button>

                <p id="edit-message" role="status"></p>
            </form>
        </div>
    </div>

</body>
</html>
