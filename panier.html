
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon panier | Vesubia Card Store</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <main class="cart-page">
        <a href="index.html" class="cart-back">
            <i class="fa-solid fa-arrow-left"></i> Retour à la boutique
        </a>

        <p class="section-eyebrow">VESUBIA CARD STORE</p>
        <h1>Mon panier</h1>
        <p>Votre sélection de cartes Pokémon.</p>

        <div id="cart-items"></div>

        <div class="cart-summary">
            <h2>Total : <span id="cart-total">0,00 €</span></h2>
            <button id="clear-cart">Vider le panier</button>
            <a href="contact.html" class="product-button">
                Contacter la boutique
            </a>
        </div>
    </main>

    <script src="js/panier.js"></script>

</html>
